<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>VAJRA - Fund-flow attribution console</title>
<meta name="description" content="VAJRA: cryptocurrency fund-flow tracing and exchange attribution console for cyber-crime investigators." />
<meta name="theme-color" content="#0D1220" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script>
  // Apply the saved (or OS-preferred) theme BEFORE first paint so there is
  // no flash of the wrong theme. Mirrors src/lib/prefs.js.
  (function () {
    try {
      var root = document.documentElement;
      var theme = localStorage.getItem("vajra-theme");
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      root.setAttribute("data-theme", theme);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", theme === "dark" ? "#0D1220" : "#EEF1F8");
    } catch (e) { /* storage unavailable - dark theme default applies */ }
  })();
</script>
</head>
<body>
<div id="root"></div>
<div class="modal-veil" id="modalVeil"></div>
<div id="toastHost" aria-live="polite"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
